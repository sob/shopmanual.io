site_name: shopmanual.io
site_description: Build manuals for my project vehicles — wiring, parts, and the decisions behind them
site_author: Sean O'Brien

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.expand
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.action.edit
    - content.action.view
  font:
    text: Roboto
    code: Roboto Mono

repo_url: https://github.com/sob/shopmanual.io
edit_uri: edit/main/docs

exclude_docs: |
  ANALYZE/
  **/CLAUDE.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.blocks.html
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - autorefs
  - macros:
      module_name: tbd_macros
      on_error_fail: true
      # Heading anchors use {#id}; remap Jinja comment delimiter so it isn't
      # mistaken for a comment-open. {{ }} variables are unused elsewhere in docs.
      j2_comment_start_string: '{##'
      j2_comment_end_string: '##}'
  - tags
  - print-site:
      add_to_navigation: true
      print_page_title: 'Print / PDF'
      add_print_site_banner: false
      add_table_of_contents: true
      toc_title: 'Table of Contents'
      toc_depth: 3
      add_full_urls: true
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: true
      cover_page_template: ""
      path_to_pdf: ""
      include_css: true
      enabled: true
      exclude:
        - index.md
        - tags.md

