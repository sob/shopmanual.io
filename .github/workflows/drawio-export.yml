name: Keep draw.io export synchronized
on:
  push:
    branches:
      - main
    paths:
      - "**.drawio"
      - .github/workflows/drawio-export.yml
concurrency:
  group: drawio-export-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drawio-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Export drawio files to asciidoctor and png files
        uses: rlespinasse/drawio-export-action@v2
        with:
          format: adoc
          transparent: false
          output: export
          # Render PNGs at 3x pixel density (~288 DPI) so diagram
          # lines and text stay crisp when zoomed or on hi-DPI displays.
          scale: 3
          # Small breathing room around the diagram edges.
          border: 10

      - name: Get author and committer info from HEAD commit
        uses: rlespinasse/git-commit-data-action@v1
        if: github.ref == 'refs/heads/main'

      - name: Commit changed files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[bot]: sync draw.io exported files"
          commit_user_name: "stimpy-bot[bot]"
          commit_user_email: "stimpy-bot <101597957+stimpy-bot[bot]@users.noreply.github.com>"

        if: github.ref == 'refs/heads/main'
