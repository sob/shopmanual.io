name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tbd_macros.py'
      - '.github/workflows/publish-docs.yml'
  # Rebuild when TBD issues change, since the tracker is generated from them.
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled, deleted]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical mkdocs-print-site-plugin
      - run: zensical build --clean
        env:
          # gh CLI (used by tbd_macros.py) reads this; auto-provided by Actions.
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
